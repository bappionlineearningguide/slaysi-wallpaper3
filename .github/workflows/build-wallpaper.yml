name: Build Slaysi 3D Wallpaper App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-app:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App Package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "No ZIP file found in repository!" }
          Write-Host "Extracting:" $zip.Name
          Expand-Archive -Path $zip.FullName -DestinationPath "./app" -Force

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish standalone SlaysiWallpaper.exe
        run: dotnet publish ./app/SlaysiWallpaper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./dist

      - name: Build 1-Click Installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "./app/dist" | Out-Null
          Copy-Item ./dist/SlaysiWallpaper.exe ./app/dist/SlaysiWallpaper.exe -Force
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc ./app/Installer.iss
          }

      - name: Upload Standalone App (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: SlaysiWallpaper-Standalone-EXE
          path: dist/SlaysiWallpaper.exe

      - name: Upload 1-Click Setup Installer (.exe)
        if: hashFiles('app/dist_installer/*.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Slaysi-Wallpaper-Setup-Installer
          path: app/dist_installer/Slaysi-Wallpaper-Setup.exe
